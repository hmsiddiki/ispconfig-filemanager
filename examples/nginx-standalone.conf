# FileGator behind nginx. Preferred: make dist/ the web root so nothing else is reachable at all.
#
#   server {
#       root /var/www/filegator/dist;
#       index index.php;
#       location ~ \.php$ { include fastcgi_params; fastcgi_pass <your-php>; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; }
#   }
#
# If the whole project folder is served instead (as on the local WNMP test setup), add these inside that server block
# or the app's logs, config and libraries can be downloaded over HTTP:

location ~ ^/filegator/(private|backend|vendor|repository|deploy|tests)(/|$) { deny all; return 404; }
location ~ ^/filegator/(configuration.*\.php|composer\.(json|lock)|package.*\.json|Dockerfile.*|.*\.md)$ { deny all; return 404; }
