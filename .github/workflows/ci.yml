name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, zip, ftp, openssl
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: PHP syntax (program, installer templates)
        run: |
          find backend tests installer -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          for t in installer/app/*.tpl installer/panel/*.tpl installer/bin/*.tpl; do
            sed -e 's/@[A-Z_]*@/1/g' "$t" > /tmp/lint.php && php -l /tmp/lint.php > /dev/null || { echo "syntax error in $t"; exit 1; }
          done

      - name: Shell syntax
        run: |
          for f in get.sh scripts/*.sh installer/*.sh tests/run.sh; do bash -n "$f"; done

      - name: JavaScript syntax (panel tab script)
        run: node --check installer/panel/filemanager-tab.js

      - name: PHP libraries (the tests load them)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: PHP tests
        run: ./tests/run.sh

      - name: Front end builds (lint included)
        run: |
          npm ci --ignore-scripts
          NODE_OPTIONS=--openssl-legacy-provider npm run build

      - name: Release package builds
        run: ./scripts/build-package.sh
